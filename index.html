        // --- WEB AUDIO API (SOUND EFFECTS) ---
        let audioCtx = null;
        const playSfx = (type) => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return; 

                if (!audioCtx) { audioCtx = new AudioContext(); }
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                if (type === 'correct') {
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
                    oscillator.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.1); 
                    gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'incorrect') {
                    oscillator.type = 'sawtooth';
                    oscillator.frequency.setValueAtTime(150, audioCtx.currentTime); 
                    oscillator.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2); 
                    gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.2);
                } else if (type === 'click') {
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(400, audioCtx.currentTime); 
                    oscillator.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05); 
                    gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.05);
                }
            } catch (err) {
                console.warn("Audio diblokir browser.", err);
            }
        };

                   <div className="bg-emerald-100 text-emerald-800 p-3 xl:p-4 rounded-xl text-center font-bold text-sm md:text-base xl:text-xl border-l-4 border-emerald-500 shadow-sm flex items-center justify-center gap-3 mb-4 flex-shrink-0">
                     <Icons.BookOpen className="w-5 h-5 xl:w-7 xl:h-7" /> Baca kisah alam di kiri, lalu selesaikan tantangan di kanan.
                   </div>

                   <div className="bg-white/80 backdrop-blur-lg rounded-3xl shadow-xl border-2 border-white/50 overflow-hidden flex flex-col md:flex-row flex-1 min-h-0">
                       <div className="md:w-1/2 bg-green-50/70 p-4 md:p-6 xl:p-8 border-b md:border-b-0 md:border-r border-green-200 flex flex-col min-h-0 overflow-y-auto custom-scrollbar">
                           <h3 className="font-black text-green-900 mb-3 xl:mb-5 flex items-center gap-3 text-base md:text-lg xl:text-2xl flex-shrink-0 drop-shadow-sm uppercase tracking-wide">
                               {currentQ.stimulusTitle}
                           </h3>
                           <div className="text-gray-900 text-sm md:text-base xl:text-xl whitespace-pre-wrap leading-relaxed font-bold bg-white/90 backdrop-blur-md p-4 md:p-6 xl:p-8 rounded-2xl border-2 border-green-100 shadow-sm flex-1">
                               {currentQ.stimulusText}
                           </div>

                       <div className="md:w-1/2 p-4 md:p-6 xl:p-8 flex flex-col min-h-0 bg-white/50 backdrop-blur-sm">

                           <p className="font-black text-gray-900 text-base md:text-lg xl:text-2xl leading-relaxed mb-4 xl:mb-6 flex-shrink-0 drop-shadow-sm mt-2">{currentQ.text}</p>
                           
                           <div className="space-y-3 xl:space-y-4 flex-grow overflow-y-auto custom-scrollbar pr-2">

                                   return (

                                           <div className={`mt-0.5 md:mt-1 flex-shrink-0 w-6 h-6 md:w-8 md:h-8 xl:w-10 xl:h-10 border-4 rounded-full flex items-center justify-center transition-colors ${isSelected ? 'border-teal-600 bg-teal-500' : 'border-gray-300 bg-white'}`}>
                                               {isSelected && <div className="w-2.5 h-2.5 md:w-3 md:h-3 xl:w-4 xl:h-4 bg-white rounded-full" />}
                                           </div>
                                           <span className="flex-1 leading-snug">{opt}</span>

                           </div>

                           <div className="flex justify-between items-center gap-3 mt-4 xl:mt-6 pt-4 border-t-2 border-gray-200 flex-shrink-0">

                               </button>
                               
                               {currentQIndex < flatQuestions.length - 1 ? (
                                   <button onClick={handleNext} disabled={!isCurrentAnswered} className={`py-3 px-6 xl:py-4 xl:px-10 rounded-2xl font-black flex items-center gap-2 transition-all text-sm md:text-base xl:text-xl ${!isCurrentAnswered ? 'bg-gray-200 text-gray-400 cursor-not-allowed border-2 border-transparent' : 'bg-gradient-to-b from-teal-500 to-teal-600 hover:from-teal-600 hover:to-teal-700 text-white shadow-[0_6px_0_#0f766e] active:shadow-none active:translate-y-2 border-none'}`}>

                                   </button>
                               ) : (
                                   <button onClick={handleSubmit} disabled={!isCurrentAnswered} className={`py-3 px-6 xl:py-4 xl:px-10 rounded-2xl font-black flex items-center gap-2 transition-all text-sm md:text-base xl:text-xl ${!isCurrentAnswered ? 'bg-gray-200 text-gray-400 cursor-not-allowed border-2 border-transparent' : 'bg-gradient-to-b from-orange-400 to-orange-500 hover:from-orange-500 hover:to-orange-600 text-white shadow-[0_6px_0_#c2410c] active:shadow-none active:translate-y-2 border-none'}`}>

        // --- LEVEL 3: SIKAP (Benar/Salah) ---
        function Level3Kalimantan({ onComplete }) {
            const data = LEVEL_DATA[3];
            const [answers, setAnswers] = useState({});
            const [step, setStep] = useState('quiz'); 
            const [currentQIndex, setCurrentQIndex] = useState(0);
            const [scoreDetails, setScoreDetails] = useState(0);

            const shuffledQuestions = React.useMemo(() => {
                return data.questions.map(q => {
                    const originalReasons = [...q.reasonOptions];
                    const shuffledReasons = shuffleArray(originalReasons);
                    const correctReasonText = originalReasons[q.correctReasonIndex];
                    const newCorrectReasonIndex = shuffledReasons.indexOf(correctReasonText);

                    return {
                        ...q,
                        reasonOptions: shuffledReasons,
                        correctReasonIndex: newCorrectReasonIndex
                    };
                });
            }, [data.questions]);

            const currentQ = shuffledQuestions[currentQIndex];

            const handleStatement = (qId, statement) => { setAnswers(prev => ({ ...prev, [qId]: { ...prev[qId], statement } })); };
            const handleReason = (qId, reasonIdxStr) => {
                const reasonIdx = parseInt(reasonIdxStr);
                setAnswers(prev => ({ ...prev, [qId]: { ...prev[qId], reasonIdx } }));
            };

            const isCurrentAnswered = answers[currentQ.id]?.statement !== undefined && answers[currentQ.id]?.reasonIdx !== undefined && !isNaN(answers[currentQ.id]?.reasonIdx);

            const handleNext = () => { if (currentQIndex < shuffledQuestions.length - 1) setCurrentQIndex(prev => prev + 1); };
            const handlePrev = () => { if (currentQIndex > 0) setCurrentQIndex(prev => prev - 1); };

            const handleSubmit = () => {
                let correctAns = 0;
                shuffledQuestions.forEach(q => {
                    const userAns = answers[q.id];
                    if (userAns && userAns.statement === q.correctStatement && userAns.reasonIdx === q.correctReasonIndex) correctAns++;
                });

                if (correctAns === shuffledQuestions.length) playSfx('correct');
                else playSfx('incorrect');

                setScoreDetails(correctAns);
                setStep('feedback');
            };

            const handleRetry = () => { setAnswers({}); setCurrentQIndex(0); setScoreDetails(0); setStep('quiz'); };

            if (step === 'feedback') {
                return (
                    <div className="flex flex-col h-full w-full max-w-5xl mx-auto pb-4 animate-fade-in justify-center">
                        <div className="bg-white/95 p-8 md:p-10 xl:p-14 rounded-3xl shadow-xl border-4 border-emerald-300 text-center mt-4">
                            <Icons.Award className="w-20 h-20 xl:w-28 xl:h-28 text-yellow-500 mx-auto animate-bounce-slow mb-3" />
                            <h3 className="text-3xl xl:text-5xl font-black text-gray-800 mb-3 xl:mb-5 uppercase tracking-wider">Hasil Analisis Fakta</h3>
                            <p className="text-xl xl:text-3xl font-bold text-gray-600 mb-8 xl:mb-12">Kamu berhasil memecahkan <span className="text-emerald-600 text-4xl xl:text-6xl mx-2 font-black">{scoreDetails}</span> dari {shuffledQuestions.length} fakta dengan sempurna!</p>
                            
                            <div className="space-y-4 xl:space-y-6 text-left max-h-[40vh] overflow-y-auto custom-scrollbar pr-3 mb-8 xl:mb-10">
                                {shuffledQuestions.map((q) => {
                                    const userAns = answers[q.id];
                                    const isCorrect = userAns?.statement === q.correctStatement && userAns?.reasonIdx === q.correctReasonIndex;

                                    return (
                                        <div key={q.id} className={`p-4 xl:p-6 rounded-xl border-2 ${isCorrect ? 'border-emerald-300 bg-emerald-50' : 'border-red-300 bg-red-50'}`}>
                                            <div className="flex gap-3 xl:gap-5 items-start mb-2 xl:mb-4">
                                                {isCorrect ? <Icons.CheckCircle className="w-6 h-6 xl:w-8 xl:h-8 text-emerald-600 flex-shrink-0 mt-0.5" /> : <Icons.X className="w-6 h-6 xl:w-8 xl:h-8 text-red-600 flex-shrink-0 mt-0.5" />}
                                                <p className="font-bold text-gray-800 text-sm md:text-base xl:text-xl">{q.text}</p>
                                            </div>
                                            <div className="ml-9 xl:ml-13 space-y-1 xl:space-y-2 text-sm md:text-base xl:text-xl">
                                                <p className="text-gray-600 font-medium">
                                                    Pernyataan: <span className={userAns?.statement === q.correctStatement ? 'text-emerald-700 font-black' : 'text-red-600 font-black line-through'}>{userAns?.statement || '-'}</span>
                                                    {!isCorrect && userAns?.statement !== q.correctStatement && <span className="text-emerald-700 font-black ml-2">({q.correctStatement})</span>}
                                                </p>
                                                <p className="text-gray-600 mt-1 font-medium">
                                                    Alasan: <span className={userAns?.reasonIdx === q.correctReasonIndex ? 'text-emerald-700 font-black' : 'text-red-600 font-black line-through'}>{userAns?.reasonIdx !== undefined && !isNaN(userAns?.reasonIdx) ? q.reasonOptions[userAns.reasonIdx] : '-'}</span>
                                                    {!isCorrect && userAns?.reasonIdx !== q.correctReasonIndex && <span className="text-emerald-700 font-black ml-2 block mt-1">✓ {q.reasonOptions[q.correctReasonIndex]}</span>}
                                                </p>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>

                            <div className="flex flex-col sm:flex-row gap-5 justify-center">
                                {scoreDetails < shuffledQuestions.length && (
                                    <button onClick={handleRetry} className="bg-yellow-400 hover:bg-yellow-500 text-yellow-900 font-black py-4 px-10 xl:py-6 xl:px-14 rounded-2xl shadow-[0_6px_0_#b45309] active:shadow-none active:translate-y-2 transition-all text-lg md:text-xl xl:text-2xl flex items-center justify-center gap-3">
                                        <Icons.RefreshCcw className="w-6 h-6 xl:w-8 xl:h-8" /> Coba Lagi
                                    </button>
                                )}
                                <button onClick={() => onComplete(scoreDetails)} className="bg-gradient-to-b from-emerald-500 to-green-600 hover:from-emerald-400 hover:to-emerald-500 text-white font-black py-4 px-10 xl:py-6 xl:px-14 rounded-2xl shadow-[0_6px_0_#064e3b] active:shadow-none active:translate-y-2 transition-all text-lg md:text-xl xl:text-2xl flex items-center justify-center gap-3 uppercase tracking-wide">
                                    Lanjut Misi 🚀
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col h-full w-full max-w-7xl mx-auto flex-1 min-h-0">
                   <div className="bg-emerald-100 text-emerald-800 p-3 xl:p-4 rounded-xl text-center font-bold text-sm md:text-base xl:text-xl border-l-4 border-emerald-500 shadow-sm flex items-center justify-center gap-3 mb-4 flex-shrink-0">
                     <Icons.BookOpen className="w-5 h-5 xl:w-7 xl:h-7" /> Baca fakta alam di kiri, lalu tentukan Benar/Salah beserta alasannya di kanan.
                   </div>

                   <div className="bg-white/80 backdrop-blur-lg rounded-3xl shadow-xl border-2 border-white/50 overflow-hidden flex flex-col md:flex-row flex-1 min-h-0">
                       <div className="md:w-1/2 bg-green-50/70 p-4 md:p-6 xl:p-8 border-b md:border-b-0 md:border-r border-green-200 flex flex-col min-h-0 overflow-y-auto custom-scrollbar">
                           <h3 className="font-black text-green-900 mb-3 xl:mb-5 flex items-center gap-3 text-base md:text-lg xl:text-2xl flex-shrink-0 drop-shadow-sm uppercase tracking-wide">
                               {data.stimulusTitle}
                           </h3>
                           <div className="text-gray-900 text-sm md:text-base xl:text-xl whitespace-pre-wrap leading-relaxed font-bold bg-white/90 backdrop-blur-md p-4 md:p-6 xl:p-8 rounded-2xl border-2 border-green-100 shadow-sm flex-1">
                               {data.stimulusText}
                           </div>
                       </div>
                       
                       <div className="md:w-1/2 p-4 md:p-6 xl:p-8 flex flex-col min-h-0 bg-white/50 backdrop-blur-sm">
                           <div className="text-xs md:text-sm xl:text-base font-black text-teal-700 uppercase tracking-wider mb-1 xl:mb-3 flex-shrink-0 bg-teal-100 inline-block px-3 py-1 rounded-lg w-max">Fakta {currentQIndex + 1} dari {shuffledQuestions.length}</div>
                           <p className="font-black text-gray-900 text-base md:text-lg xl:text-2xl leading-relaxed mb-4 xl:mb-6 flex-shrink-0 drop-shadow-sm mt-2">{currentQ.text}</p>
                           
                           <div className="space-y-4 xl:space-y-6 flex-grow overflow-y-auto custom-scrollbar pr-2">
                               <div className="space-y-2 xl:space-y-4">
                                   <label className="block text-sm md:text-base xl:text-xl font-bold text-gray-900 drop-shadow-sm uppercase">Fakta tersebut:</label>
                                   <div className="flex gap-3 xl:gap-5">
                                       <button onClick={() => handleStatement(currentQ.id, 'Benar')} className={`flex-1 py-4 xl:py-6 rounded-2xl border-4 font-black text-lg xl:text-2xl transition-all shadow-sm uppercase tracking-wide ${answers[currentQ.id]?.statement === 'Benar' ? 'bg-emerald-500 border-emerald-600 text-white scale-[1.02]' : 'bg-white border-gray-300 text-gray-700 hover:border-emerald-400 hover:bg-emerald-50'}`}>
                                           Benar
                                       </button>
                                       <button onClick={() => handleStatement(currentQ.id, 'Salah')} className={`flex-1 py-4 xl:py-6 rounded-2xl border-4 font-black text-lg xl:text-2xl transition-all shadow-sm uppercase tracking-wide ${answers[currentQ.id]?.statement === 'Salah' ? 'bg-red-500 border-red-600 text-white scale-[1.02]' : 'bg-white border-gray-300 text-gray-700 hover:border-red-400 hover:bg-red-50'}`}>
                                           Salah
                                       </button>
                                   </div>
                               </div>

                               <div className="space-y-2 xl:space-y-4 pt-3 xl:pt-5 border-t-2 border-gray-300 mt-4">
                                   <label className="block text-sm md:text-base xl:text-xl font-bold text-gray-900 drop-shadow-sm uppercase">Pilih Alasannya:</label>
                                   <div className="relative">
                                       <select 
                                            value={answers[currentQ.id]?.reasonIdx !== undefined ? answers[currentQ.id].reasonIdx : ""} 
                                            onChange={(e) => handleReason(currentQ.id, e.target.value)} 
                                            className="w-full p-4 md:p-5 xl:p-6 rounded-2xl border-4 border-gray-300 bg-white text-sm md:text-base xl:text-xl font-bold text-gray-800 outline-none focus:border-emerald-500 transition-all appearance-none cursor-pointer shadow-sm hover:bg-gray-50"
                                       >
                                           <option value="" disabled>-- Klik di sini untuk memilih alasan --</option>
                                           {currentQ.reasonOptions.map((opt, idx) => (
                                               <option key={idx} value={idx}>{opt}</option>
                                           ))}
                                       </select>
                                       <div className="absolute right-4 xl:right-6 top-1/2 transform -translate-y-1/2 pointer-events-none bg-gray-200 p-2 rounded-full">
                                           <Icons.ArrowRight className="w-4 h-4 xl:w-5 xl:h-5 text-gray-600 rotate-90" />
                                       </div>
                                   </div>
                               </div>
                           </div>

                           <div className="flex justify-between items-center gap-3 mt-4 xl:mt-6 pt-4 border-t-2 border-gray-200 flex-shrink-0">
                               <button onClick={handlePrev} disabled={currentQIndex === 0} className={`py-3 px-4 xl:py-4 xl:px-6 rounded-2xl font-black flex items-center gap-2 transition-all text-sm md:text-base xl:text-xl ${currentQIndex === 0 ? 'bg-gray-200 text-gray-400 cursor-not-allowed border-2 border-transparent' : 'bg-white text-gray-800 border-4 border-gray-300 hover:bg-gray-100 shadow-sm'}`}>
                                   <Icons.ArrowRight className="w-5 h-5 xl:w-7 xl:h-7 rotate-180" /> <span className="hidden sm:inline">Sebelumnya</span>
                               </button>
                               
                               {currentQIndex < shuffledQuestions.length - 1 ? (
                                   <button onClick={handleNext} disabled={!isCurrentAnswered} className={`py-3 px-6 xl:py-4 xl:px-10 rounded-2xl font-black flex items-center gap-2 transition-all text-sm md:text-base xl:text-xl ${!isCurrentAnswered ? 'bg-gray-200 text-gray-400 cursor-not-allowed border-2 border-transparent' : 'bg-gradient-to-b from-teal-400 to-teal-500 hover:from-teal-500 hover:to-teal-600 text-white shadow-[0_6px_0_#0f766e] active:shadow-none active:translate-y-2 border-none'}`}>
                                       <span className="hidden sm:inline">Selanjutnya</span> <Icons.ArrowRight className="w-5 h-5 xl:w-7 xl:h-7" />
                                   </button>
                               ) : (
                                   <button onClick={handleSubmit} disabled={!isCurrentAnswered} className={`py-3 px-6 xl:py-4 xl:px-10 rounded-2xl font-black flex items-center gap-2 transition-all text-sm md:text-base xl:text-xl ${!isCurrentAnswered ? 'bg-gray-200 text-gray-400 cursor-not-allowed border-2 border-transparent' : 'bg-gradient-to-b from-orange-400 to-orange-500 hover:from-orange-500 hover:to-orange-600 text-white shadow-[0_6px_0_#c2410c] active:shadow-none active:translate-y-2 border-none uppercase tracking-wide'}`}>
                                       <Icons.CheckCircle className="w-5 h-5 xl:w-7 xl:h-7" /> Kumpulkan
                                   </button>
                               )}
                           </div>
                       </div>
                   </div>
                </div>
            );
        }

        // --- LEVEL 4: SULAWESI (Mengevaluasi & Mengkreasi) ---
        function Level4Sulawesi({ onComplete }) {
            const data = LEVEL_DATA[4];
            const [answers, setAnswers] = useState({});
            const [completed, setCompleted] = useState(false);
            const [feedbackMsg, setFeedbackMsg] = useState("");
            const [scoreLocal, setScoreLocal] = useState(0);

            const handleEval = (cId, val) => setAnswers(p => ({...p, [cId]: {...p[cId], eval: parseInt(val)}}));
            const handleCreate = (cId, val) => setAnswers(p => ({...p, [cId]: {...p[cId], create: parseInt(val)}}));

            const handleCheckAnswer = () => {
                let allFilled = true;
                let correctCountLocal = 0;
                
                data.cases.forEach(c => {
                    const a = answers[c.id];
                    if (!a || a.eval === undefined || a.create === undefined || isNaN(a.eval) || isNaN(a.create)) {
                        allFilled = false;
                    } else if (a.eval === c.evalCorrect && a.create === c.createCorrect) {
                        correctCountLocal++;
                    }
                });

                if (!allFilled) {
                    setFeedbackMsg("Lengkapi pilihan Evaluasi dan Pilih Perbaikan pada ke-5 kasus alam di atas ya, Penjelajah!");
                    return;
                }

                if (correctCountLocal === data.cases.length) {
                    playSfx('correct');
                } else {
                    playSfx('incorrect');
                }

                setScoreLocal(correctCountLocal);
                setCompleted(true);
            };

            return (
                <div className="flex flex-col h-full w-full max-w-7xl mx-auto flex-1 min-h-0 pb-4">
                    {!completed ? (
                        <div className="bg-white/95 rounded-3xl shadow-xl border-4 border-emerald-300 flex flex-col flex-1 min-h-0 mt-4 overflow-hidden p-4 md:p-6 xl:p-8 animate-fade-in">
                            <div className="bg-emerald-100 text-emerald-900 p-4 md:p-5 xl:p-6 rounded-2xl text-center font-bold text-sm md:text-base xl:text-xl border-2 border-emerald-400 shadow-sm mb-4 md:mb-6 flex-shrink-0 flex items-center gap-4">
                                <div className="bg-emerald-600 text-white p-3 rounded-xl shadow-md"><Icons.Zap className="w-6 h-6 md:w-8 md:h-8 xl:w-10 xl:h-10 flex-shrink-0" /></div>
                                <span className="text-left leading-relaxed">{data.stimulusText}</span>
                            </div>
                            
                            <div className="flex-grow overflow-y-auto custom-scrollbar pr-2 md:pr-4 space-y-6 xl:space-y-8 pb-10">
                                {data.cases.map((c, i) => (
                                    <div key={c.id} className="bg-slate-50 p-5 xl:p-8 rounded-2xl border-4 border-slate-200 shadow-sm">
                                        <h4 className="font-black text-slate-800 text-base md:text-xl xl:text-2xl mb-4 leading-relaxed bg-white p-4 rounded-xl shadow-sm border border-slate-100">{c.text}</h4>
                                        <div className="space-y-4 xl:space-y-6 bg-white p-4 xl:p-6 rounded-2xl border-2 border-slate-100">
                                            <div className="flex flex-col">
                                                <label className="text-sm md:text-base xl:text-xl font-black text-red-800 mb-2 flex items-center gap-2 uppercase"><span className="text-2xl">🔍</span> Evaluasi Tindakan:</label>
                                                <select value={answers[c.id]?.eval !== undefined ? answers[c.id].eval : ""} onChange={e => handleEval(c.id, e.target.value)} className="w-full p-4 md:p-5 rounded-xl border-4 border-red-200 bg-red-50 outline-none focus:border-red-500 font-bold text-gray-800 text-sm md:text-base xl:text-xl transition-colors cursor-pointer appearance-none shadow-sm hover:bg-red-100">
                                                    <option value="" disabled>-- Pilih Hasil Evaluasi Kesalahan --</option>
                                                    {c.evalOptions.map((opt, idx) => <option key={idx} value={idx}>{opt}</option>)}
                                                </select>
                                            </div>
                                            <div className="flex flex-col">
                                                <label className="text-sm md:text-base xl:text-xl font-black text-emerald-800 mb-2 flex items-center gap-2 uppercase"><span className="text-2xl">💡</span> Pilih Perbaikan:</label>
                                                <select value={answers[c.id]?.create !== undefined ? answers[c.id].create : ""} onChange={e => handleCreate(c.id, e.target.value)} className="w-full p-4 md:p-5 rounded-xl border-4 border-emerald-200 bg-emerald-50 outline-none focus:border-emerald-500 font-bold text-gray-800 text-sm md:text-base xl:text-xl transition-colors cursor-pointer appearance-none shadow-sm hover:bg-emerald-100">
                                                    <option value="" disabled>-- Pilih Solusi Perbaikan yang Benar --</option>
                                                    {c.createOptions.map((opt, idx) => <option key={idx} value={idx}>{opt}</option>)}
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                            
                            <div className="mt-5 md:mt-6 pt-4 md:pt-6 border-t-4 border-gray-100 text-center flex-shrink-0 flex flex-col items-center">
                                {feedbackMsg && <p className="text-red-700 font-black text-sm md:text-base xl:text-xl mb-4 bg-red-100 p-3 md:p-4 rounded-xl border-2 border-red-300 w-full max-w-3xl shadow-sm">{feedbackMsg}</p>}
                                <button onClick={handleCheckAnswer} className="bg-gradient-to-b from-emerald-600 to-green-700 hover:from-emerald-500 hover:to-green-600 text-white font-black py-4 px-10 xl:py-5 xl:px-14 rounded-2xl shadow-[0_6px_0_#064e3b] active:shadow-none active:translate-y-2 transition-all text-base md:text-xl xl:text-2xl flex items-center justify-center gap-3 w-full md:w-auto uppercase tracking-wide">
                                    <Icons.CheckCircle className="w-6 h-6 xl:w-8 xl:h-8" /> Cek Solusi Lingkungan
                                </button>
                            </div>
                        </div>
                    ) : (
                        <div className="bg-white/95 p-8 md:p-12 xl:p-16 rounded-3xl shadow-2xl text-center space-y-6 border-4 border-emerald-300 max-w-4xl mx-auto animate-fade-in mt-10">
                            <div className="w-20 h-20 xl:w-28 xl:h-28 bg-emerald-100 rounded-full flex items-center justify-center mx-auto text-4xl xl:text-6xl shadow-inner border-4 border-emerald-400">{scoreLocal === data.cases.length ? '🏆' : '👍'}</div>
                            <h3 className="text-2xl md:text-4xl xl:text-5xl font-black text-emerald-900 uppercase tracking-wider mb-4">Evaluasi Selesai!</h3>
                            <p className="text-lg md:text-xl xl:text-3xl font-bold text-gray-700 leading-relaxed">Kamu telah membantu menjaga alam! <br/><br/>Kamu mengevaluasi dan memperbaiki dengan tepat pada <span className="text-emerald-600 text-4xl xl:text-6xl mx-2 font-black">{scoreLocal}</span> dari {data.cases.length} kasus lingkungan.</p>
                            <button onClick={() => onComplete(scoreLocal)} className="bg-gradient-to-b from-emerald-500 to-green-600 hover:from-emerald-400 hover:to-green-500 text-white font-black w-full py-5 text-xl xl:text-3xl rounded-2xl shadow-[0_6px_0_#064e3b] active:shadow-none active:translate-y-2 transition-all mt-6 uppercase tracking-wide">Lanjut ke Puncak Harmoni 🚀</button>
                        </div>
                    )}
                </div>
            );
        }

        // --- LEVEL 5: PAPUA (Merefleksi) ---
        function Level5Papua({ onComplete, saveRef, saveData }) {
            const data = LEVEL_DATA[5];
            const [rating, setRating] = useState(0);
            const [a1, setA1] = useState("");
            const [a2, setA2] = useState("");
            const [a3, setA3] = useState("");
            const [feedbackMsg, setFeedbackMsg] = useState("");

            const handleFinish = () => {
                if (rating === 0 || !a1.trim() || !a2.trim() || !a3.trim()) {
                    setFeedbackMsg("Wah, mohon lengkapi pemberian bintang dan isi semua kotak laporan ya, Penjelajah!");
                    return;
                }
                playSfx('correct');
                saveData('final_project', { rating, pemahaman: a1, strategi: a2, aksi: a3 });
                saveRef(a3);
                onComplete();
            };

            return (
                <div className="flex flex-col h-full w-full max-w-5xl mx-auto flex-1 min-h-0 pb-4 animate-fade-in justify-center">
                    <div className="bg-white/95 p-6 md:p-10 xl:p-14 rounded-3xl shadow-2xl border-b-8 border-yellow-400 w-full flex flex-col flex-1 min-h-0 mt-4 overflow-hidden">
                        
                        <div className="text-center border-b-4 border-gray-100 pb-4 md:pb-6 mb-4 md:mb-6 flex-shrink-0">
                            <h3 className="text-2xl md:text-4xl xl:text-5xl font-black text-gray-800 uppercase tracking-wider mb-2">{data.title}</h3>
                            <p className="text-sm md:text-base xl:text-xl font-bold text-amber-600">{data.subtitle}</p>
                        </div>

                        <div className="flex-grow overflow-y-auto custom-scrollbar pr-3 space-y-6 md:space-y-8">
                            
                            <div className="bg-teal-50 p-5 md:p-6 xl:p-8 rounded-3xl border-2 border-teal-200 shadow-sm">
                                <label className="block text-base md:text-lg xl:text-2xl font-black text-teal-900 mb-4 leading-relaxed">{data.questions.q1}</label>
                                <div className="flex justify-center gap-3 md:gap-4 mb-6 bg-white py-4 rounded-2xl border border-teal-100">
                                    {[1, 2, 3, 4, 5].map(star => (
                                        <Icons.Star 
                                            key={star} 
                                            onClick={() => { setRating(star); playSfx('click'); }} 
                                            className={`w-12 h-12 md:w-16 md:h-16 xl:w-20 xl:h-20 cursor-pointer transition-all transform hover:scale-110 ${rating >= star ? 'text-yellow-400 fill-yellow-400 drop-shadow-md' : 'text-gray-300 fill-gray-100'}`} 
                                        />
                                    ))}
                                </div>
                                <textarea rows="3" value={a1} onChange={e => setA1(e.target.value)} placeholder="Ceritakan pengalamanmu..." className="w-full p-4 md:p-5 rounded-2xl border-4 border-teal-200 bg-white outline-none focus:border-teal-500 font-bold text-gray-800 text-sm md:text-base xl:text-xl resize-none shadow-inner"></textarea>
                            </div>

                            <div className="bg-emerald-50 p-5 md:p-6 xl:p-8 rounded-3xl border-2 border-emerald-200 shadow-sm">
                                <label className="block text-base md:text-lg xl:text-2xl font-black text-emerald-900 mb-4 leading-relaxed">{data.questions.q2}</label>
                                <textarea rows="3" value={a2} onChange={e => setA2(e.target.value)} placeholder="Tuliskan kesulitanmu..." className="w-full p-4 md:p-5 rounded-2xl border-4 border-emerald-200 bg-white outline-none focus:border-emerald-500 font-bold text-gray-800 text-sm md:text-base xl:text-xl resize-none shadow-inner"></textarea>
                            </div>

                            <div className="bg-green-50 p-5 md:p-6 xl:p-8 rounded-3xl border-2 border-green-200 shadow-sm">
                                <label className="block text-base md:text-lg xl:text-2xl font-black text-green-900 mb-4 leading-relaxed">{data.questions.q3}</label>
                                <textarea rows="3" value={a3} onChange={e => setA3(e.target.value)} placeholder="Misal: Padi -> Tikus -> Ular -> Elang" className="w-full p-4 md:p-5 rounded-2xl border-4 border-green-200 bg-white outline-none focus:border-green-500 font-bold text-gray-800 text-sm md:text-base xl:text-xl resize-none shadow-inner"></textarea>
                            </div>

                        </div>

                        <div className="mt-6 pt-4 border-t-4 border-gray-100 flex flex-col items-center flex-shrink-0">
                            {feedbackMsg && <p className="text-red-700 font-black text-sm md:text-base xl:text-xl mb-4 bg-red-100 p-4 rounded-xl border-2 border-red-300 text-center w-full shadow-sm">{feedbackMsg}</p>}
                            <button onClick={handleFinish} className="bg-gradient-to-b from-yellow-400 to-amber-500 hover:from-yellow-500 hover:to-amber-600 text-amber-900 font-black py-4 px-10 xl:py-6 xl:px-14 rounded-full shadow-[0_8px_0_#b45309] active:shadow-none active:translate-y-2 transition-all text-lg md:text-xl xl:text-3xl flex items-center justify-center gap-3 w-full md:w-auto uppercase tracking-wider">
                                <Icons.Award className="w-8 h-8 xl:w-10 xl:h-10" /> Sahkan Laporan Observasi!
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // --- END SCREEN ---
        function EndScreen({ userData, correctCount, onRestart, playerName, playerSchool }) {
            const [isSaving, setIsSaving] = useState(false);
            const [saveStatus, setSaveStatus] = useState("idle"); 

            const handleSaveToGoogleSheets = async () => {
                if(!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("MASUKKAN_URL")) return setSaveStatus("error");
                setIsSaving(true);
                
                const payload = {
                    nama: playerName, sekolah: playerSchool, skor: correctCount, benar: correctCount,
                    ref1: "-", ref2: "-", ref3: "-", ref4: "-",
                    papua_masalah: userData.final_project?.pemahaman || "-",
                    papua_solusi: userData.final_project?.strategi || "-",
                    papua_kampanye: userData.final_project ? `Contoh Rantai Makanan: ${userData.final_project.aksi} | Bintang Rating: ${userData.final_project.rating}` : "-",
                };
                
                try {
                    await fetch(GOOGLE_SCRIPT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
                    setSaveStatus("success");
                } catch (error) { setSaveStatus("error"); } finally { setIsSaving(false); }
            };

            return (
                <div className="flex flex-col items-center justify-center gap-6 xl:gap-10 animate-fade-in w-full flex-1 min-h-0 overflow-y-auto pb-8">
                  <div className="text-center bg-white/95 p-6 md:p-10 xl:p-14 rounded-[3rem] shadow-2xl w-full max-w-2xl xl:max-w-4xl border-4 border-yellow-400 mt-8">
                    <img src={LOGO_IMAGE_URL} alt="Logo" className="w-24 h-24 md:w-32 md:h-32 xl:w-48 xl:h-48 object-cover mx-auto animate-bounce-slow drop-shadow-2xl rounded-full border-4 border-white mb-6 shadow-inner" />
                    <h2 className="text-4xl md:text-6xl xl:text-8xl font-black text-amber-500 mt-4 xl:mt-8 drop-shadow-sm uppercase tracking-wider">SELAMAT!</h2>
                    <p className="text-xl md:text-3xl xl:text-5xl font-bold mt-4 xl:mt-6 text-gray-700">{playerName}, <br/><span className="text-emerald-600 block mt-2">Penjaga Bumi Sejati</span></p>
                    <div className="text-xl md:text-2xl xl:text-4xl font-black text-gray-500 mt-8 xl:mt-12 bg-gray-50 p-6 rounded-3xl border-2 border-gray-200">
                        Skor Keseimbangan Alam <br/><span className="text-6xl md:text-7xl xl:text-9xl text-yellow-500 text-outline inline-block mt-4 mb-2 drop-shadow-xl">{correctCount}</span><br/><span className="text-lg md:text-xl xl:text-2xl">Dari total 29 Poin</span>
                    </div>
                  </div>

                  <div className="w-full max-w-2xl xl:max-w-4xl bg-white p-6 md:p-10 xl:p-12 rounded-[3rem] shadow-xl border-b-8 border-emerald-400 relative text-base">
                    <div className="text-center border-b-4 border-gray-100 pb-4 xl:pb-6 mb-4 xl:mb-6">
                      <h3 className="font-black text-2xl md:text-4xl xl:text-5xl text-emerald-800 uppercase tracking-wide">Lencana Ekologi</h3>
                      <p className="text-emerald-600 font-bold text-lg md:text-2xl xl:text-3xl mt-2 xl:mt-4 bg-emerald-50 inline-block px-6 py-2 rounded-full border border-emerald-200">{playerName} - {playerSchool}</p>
                    </div>
                    <div className="space-y-3 xl:space-y-5 max-h-48 xl:max-h-80 overflow-y-auto pr-3 custom-scrollbar text-sm md:text-base xl:text-xl">
                      <p className="bg-amber-50 p-5 xl:p-8 rounded-2xl border-2 border-amber-200 shadow-sm text-gray-800 font-bold leading-relaxed">
                          <span className="text-amber-800 block mb-2 xl:mb-3 font-black uppercase tracking-wider text-xs md:text-sm xl:text-base">Laporan Rantai Makanan:</span> 
                          "{userData.ref5 || '-'}"
                      </p>
                    </div>
                  </div>

                  <div className="w-full max-w-2xl xl:max-w-4xl space-y-4 xl:space-y-6 mt-4">
                    {saveStatus === 'idle' && <button onClick={handleSaveToGoogleSheets} disabled={isSaving} className="bg-gradient-to-b from-blue-500 to-blue-600 hover:from-blue-400 hover:to-blue-500 text-white font-black w-full py-5 xl:py-6 rounded-2xl flex items-center justify-center gap-3 text-lg md:text-2xl xl:text-3xl shadow-[0_8px_0_#1e3a8a] active:shadow-none active:translate-y-2 transition-all uppercase tracking-wide">{isSaving ? "Menyimpan..." : <><Icons.Save className="w-6 h-6 xl:w-8 xl:h-8"/> Kirim Laporan ke Pak Rahmat</>}</button>}
                    {saveStatus === 'success' && <div className="bg-green-100 text-green-800 p-5 xl:p-6 rounded-2xl text-center font-black text-lg xl:text-2xl border-4 border-green-300 shadow-sm">Berhasil dikirim! ✅</div>}
                    {saveStatus === 'error' && <div className="bg-red-100 text-red-800 p-5 xl:p-6 rounded-2xl text-center font-black text-lg xl:text-2xl border-4 border-red-300 shadow-sm">Gagal terhubung dengan server. <button onClick={()=>setSaveStatus('idle')} className="underline text-red-600 ml-2 hover:text-red-900 transition-colors">Coba lagi</button></div>}
                    <button onClick={onRestart} className="bg-gradient-to-b from-gray-700 to-gray-800 hover:from-gray-600 hover:to-gray-700 text-white font-black w-full py-5 xl:py-6 rounded-2xl flex items-center justify-center gap-3 text-lg md:text-2xl xl:text-3xl shadow-[0_8px_0_#374151] active:shadow-none active:translate-y-2 transition-all uppercase tracking-wide"><Icons.RefreshCcw className="w-6 h-6 xl:w-8 xl:h-8"/> Main Lagi</button>
                  </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PetualanganBhinneka />);
    </script>
</body>
</html>
